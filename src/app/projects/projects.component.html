<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=star" />

<h3>Project Experiences:</h3>
<section>
    @for (project of myProjects; track project.id) {
                <mat-card class="projects">
                    <mat-card-header>
                        <mat-card-title>
                            <a [routerLink]="['/projects', project.id]" class="project-link">
                                {{project.title}}
                            </a>
                        </mat-card-title>
                    </mat-card-header>
                    <img mat-card-image [src]="project.img_1">
                    <mat-card-content>
                        <p>{{project.description}}</p>
                    </mat-card-content>
                </mat-card>
        } @empty {
            <p>Fetching from Firestore...</p>
        }

</section>
