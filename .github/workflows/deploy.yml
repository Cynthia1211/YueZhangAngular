name: Deploy Angular to S3

on:
  push:
    branches:
      - master  # 确保这和你刚才推送的分支名一致

# 1. 必须显示声明权限，GitHub Actions 才能去向 AWS 申请 OIDC 临时凭证
permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Angular
        run: npm run build --configuration=production

      # 2. 使用 OIDC 认证：直接拿着你的 ARN 去 AWS 换取 1 小时临时权限
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::038715112452:role/Github_Action
          aws-region: ca-central-1

      # 3. 部署到 S3：使用 AWS 官方自带的 CLI 命令同步，安全又稳定
      - name: Deploy to S3
        run: |
          aws s3 sync dist/assignment-yue-zhang/browser s3://yuezhang.site --delete
