name: Deploy Angular to S3

on:
  push:
    branches:
      - master

# Use GitHub's OIDC identity to obtain temporary AWS credentials.
permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Angular
        run: npm run build --configuration=production

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::038715112452:role/Github_Action
          aws-region: ca-central-1

      - name: Deploy to S3
        run: aws s3 sync dist/assignment-yue-zhang/browser s3://yuezhang.site --delete
